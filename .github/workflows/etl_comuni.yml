# .github/workflows/etl_comuni.yml
# ETL Polis — aggiornamento dati comunali (Cruscotto Italia / AgID)
#
# Cosa fa:
#  - gira ogni notte (e su richiesta manuale)
#  - scarica KPI + iniziative PA per i capoluoghi
#  - versiona lo storico (comuni/storico/<istat>/<data>.json)
#  - committa solo se qualcosa è cambiato
#
# NB: il server AgID applica un limite di richieste. Lo --sleep tiene
# le richieste distanziate. Non abbassarlo per "andare più veloce".

name: ETL Comuni (Cruscotto Italia)

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC ogni notte
  workflow_dispatch:        # avvio manuale dalla tab Actions
    inputs:
      istat:
        description: "Codici ISTAT specifici (spazio-separati). Vuoto = tutti i capoluoghi."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: etl-comuni
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certifi (TLS)
        run: pip install --quiet certifi

      - name: Run ETL
        run: |
          cd etl
          if [ -n "${{ github.event.inputs.istat }}" ]; then
            python3 etl_comuni.py --out ../app/data/comuni --sleep 1.5 --istat ${{ github.event.inputs.istat }}
          else
            python3 etl_comuni.py --out ../app/data/comuni --sleep 1.5
          fi

      - name: Commit dati e storico
        run: |
          git config user.name  "polis-etl-bot"
          git config user.email "etl@polis.local"
          git add -A app/data/comuni
          if git diff --cached --quiet; then
            echo "Nessuna variazione: niente da committare."
          else
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git commit -m "ETL comuni: aggiornamento dati $(date -u +%Y-%m-%d)"
            git push origin HEAD:${{ github.ref_name }}
          fi
