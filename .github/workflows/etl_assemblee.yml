# .github/workflows/etl_assemblee.yml
# Aggiornamento quotidiano delle sedute di Camera e Senato.
# Se i portali respingono il runner, il passo fallisce senza rompere nulla:
# in quel caso si usa la modalità manuale (vedi COME_SCARICARE_A_MANO.md).
name: ETL Assemblee
on:
  schedule:
    - cron: "0 7 * * 1-5"    # nei giorni feriali, quando l'Aula lavora
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: etl-assemblee
jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet certifi
      - name: Scarica le sedute
        continue-on-error: true
        run: cd etl && python3 etl_assemblee.py --out ../dati/assemblee.json
      - run: |
          git config user.name "polis-etl-bot"
          git config user.email "etl@polis.local"
          git add -A dati/assemblee.json || true
          if git diff --cached --quiet; then echo "Nessuna variazione."; else
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git commit -m "ETL assemblee $(date -u +%Y-%m-%d)"
            git push origin HEAD:${{ github.ref_name }}
          fi
